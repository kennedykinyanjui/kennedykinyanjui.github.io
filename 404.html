<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Page not found — Kennedy Kinyanjui</title>
	<meta name="robots" content="noindex">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<meta name="theme-color" content="#0b0d10">
	<meta name="color-scheme" content="dark">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
	<link rel="stylesheet" href="/css/style.css">
	<style>
		.notfound {
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			justify-content: center;
			min-height: 100vh;
			min-height: 100svh;
			padding: 0 var(--gutter);
			max-width: var(--shell);
			margin: 0 auto;
		}

		.notfound__code {
			font-family: var(--font-mono);
			font-size: 0.8rem;
			letter-spacing: 0.16em;
			text-transform: uppercase;
			color: var(--accent);
			margin-bottom: 1.25rem;
		}

		.notfound h1 {
			font-size: clamp(2rem, 6vw, 3.25rem);
			letter-spacing: -0.03em;
		}

		.notfound p {
			margin-top: 1rem;
			max-width: 44ch;
			color: var(--text-muted);
		}

		.notfound .btn {
			margin-top: 2.25rem;
		}
	</style>
</head>

<body>
	<main class="notfound">
		<p class="notfound__code">Error 404</p>
		<h1>That page doesn't exist.</h1>
		<p>The link may be out of date, or the page may have moved. Everything on this site lives on
			the one page.</p>
		<a class="btn btn--primary" href="/">Back to the homepage</a>
	</main>
</body>

</html>
